name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Grant execute
        run: chmod +x gradlew
      - name: Decode keystore
        if: env.RELEASE_KEYSTORE_B64 != ''
        run: echo "$RELEASE_KEYSTORE_B64" | base64 -d > "${{ runner.temp }}/release.keystore"
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
      - name: Build Release
        run: ./gradlew --stacktrace assembleRelease
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.keystore
          RELEASE_STORE_PASS: ${{ secrets.RELEASE_STORE_PASS }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASS: ${{ secrets.RELEASE_KEY_PASS }}
      - name: Prepare Assets
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION=$(printf '%s' "$VERSION" | LC_ALL=C tr -cd 'A-Za-z0-9._-')
          cp "$APK" "nettra-${VERSION}.apk"
          echo "APK_PATH=$APK" >> $GITHUB_ENV
          echo "RELEASE_NAME=nettra-${VERSION}.apk" >> $GITHUB_ENV
          mkdir -p release
          cp "nettra-${VERSION}.apk" release/
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.RELEASE_NAME }}
          name: "nettra ${{ github.ref_name }}"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
